# Backend test suite on every PR to langgraph-build and main (T23; design §14, §16).
#
# - No repository secrets and no model API keys: every model, PubMed and storage call in
#   the suite is mocked or recorded. The workflow only needs read access to the repo.
# - A Postgres service with pgvector runs the Postgres-only tests that otherwise skip:
#   the LangGraph checkpointer resume test (LANGGRAPH_TEST_PG_DSN) and the offline
#   library store tests (LIBRARY_TEST_PG_DSN). They get separate throwaway databases
#   because the library test drops its database's public schema.
# - redis-server, Tesseract, Ghostscript and OCRmyPDF are installed so the MCP Redis test
#   and the library OCR tests run too. The run fails if any test skips, so a missing
#   service can't quietly turn these tests off again.
name: backend-tests

on:
  pull_request:
    branches: [langgraph-build, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: postgres
          # Throwaway CI database on localhost: no password at all, so nothing
          # password-shaped sits in the repo for secret scanners to flag.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: library_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      LIBRARY_TEST_PG_DSN: postgresql+psycopg://postgres@localhost:5432/library_test
      LANGGRAPH_TEST_PG_DSN: postgresql://postgres@localhost:5432/checkpoint_test
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"  # matches backend/Dockerfile (python:3.11-slim)
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install system packages (Redis, Tesseract, Ghostscript)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends redis-server tesseract-ocr ghostscript

      - name: Install Python dependencies
        # The [test] extra brings pytest, the MCP SDK, PyMuPDF and reportlab. OCRmyPDF is
        # installed on its own rather than through the [library] extra, which would also
        # pull in torch and transformers that no test needs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[test]" "ocrmypdf>=16.0"

      - name: Create the checkpointer database
        run: psql -h localhost -U postgres -d library_test -c "CREATE DATABASE checkpoint_test"

      - name: Run the backend test suite
        run: python -m pytest -q -rs --junitxml=pytest-report.xml

      - name: Fail if any test was skipped
        if: success()
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"{total} tests, {skipped} skipped")
          if skipped:
              sys.exit("Tests were skipped in CI; every optional dependency and service is "
                       "installed here, so a skip means one of them went missing.")
          EOF
