# PROPOSED by the T38 routing experiment. NOT IN USE: config/routing.yaml is unchanged.
# Winners across BOTH providers (Claude run: auto/T38-live / PR #104; OpenAI run: this branch),
# chosen with app.evaluation.selection.select_model (max_failure_rate 0.05, tie_margin 0.01)
# over the merged per-step results. TUNE split only (55 videos; 48 extraction items,
# 174 stance/verify claims): NOT the held-out test split, so not the system's accuracy.
# Frozen evidence sha256 c4ff82bf69dc85c3b80503a2b7d559b820255b1a90ac3a3fc069593e8d4d4ca5.
# status stays provisional: critique and judge_explanation were not part of this experiment.
# Before adopting: copy by hand into config/routing.yaml and evaluate against the baseline (§14).
version: routing_v2
status: provisional
routing:
  extract_claims:
    provider: anthropic
    model: claude-sonnet-5-5
    prompt: extract_v2
  analyze_stance:
    provider: anthropic
    model: claude-sonnet-5-5
    prompt: stance_v1
  verify_claims:
    provider: anthropic
    model: claude-opus-5-5
    prompt: verify_v3
  critique:
    provider: openai
    model: gpt-4o-2024-08-06
    prompt: critic_v1
  judge_explanation:
    provider: anthropic
    model: claude-sonnet-5-5
    prompt: explain_v2
  fallback:
    'on':
    - timeout
    - 5xx
    retries: 1
    use:
      provider: openai
      model: gpt-4o-2024-08-06
pricing:
  claude-haiku-5-5:
    input: 0.1
    output: 0.5
  claude-sonnet-5-5:
    input: 2.0
    output: 10.0
  claude-opus-5-5:
    input: 4.0
    output: 20.0
  gpt-4o-2024-08-06:
    input: 2.5
    output: 10.0
  gpt-5.6-luna:
    input: 0.2
    output: 1.2
  gpt-5.6-terra:
    input: 2.0
    output: 12.0
models:
  gpt-4o-2024-08-06:
    reasoning: false
  gpt-5.6-luna:
    reasoning: true
    reasoning_effort: medium
  gpt-5.6-terra:
    reasoning: true
    reasoning_effort: medium
reasoning_allowance:
  extract_claims: 1500
  analyze_stance: 800
  verify_claims: 2500
