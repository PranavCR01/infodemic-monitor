# provisional: OpenAI candidates not yet run
# T38 Option C (2026-11-24): winners among the Claude candidates only, on the TUNE split
# (55 videos; 48 extraction items, 174 stance/verify claims). Not the held-out test.
# gpt-5.6-luna (extract, stance) and gpt-5.6-terra (verify) still have to run on the same
# frozen evidence (sha256 c4ff82bf69dc85c3b80503a2b7d559b820255b1a90ac3a3fc069593e8d4d4ca5)
# before this table can be final. config/routing.yaml is unchanged.
# PROPOSED by the routing experiment (T38). Not in use: review it, then copy the
# winners into config/routing.yaml by hand and evaluate against the baseline (§14).
version: routing_v2
status: "provisional: OpenAI candidates not yet run"
routing:
  extract_claims:
    provider: anthropic
    model: claude-sonnet-5-5
    prompt: extract_v2
  analyze_stance:
    provider: anthropic
    model: claude-sonnet-5-5
    prompt: stance_v1
  verify_claims:
    provider: anthropic
    model: claude-opus-5-5
    prompt: verify_v3
  critique:
    provider: openai
    model: gpt-4o-2024-08-06
    prompt: critic_v1
  judge_explanation:
    provider: anthropic
    model: claude-sonnet-5-5
    prompt: explain_v2
  fallback:
    'on':
    - timeout
    - 5xx
    retries: 1
    use:
      provider: openai
      model: gpt-4o-2024-08-06
pricing:
  claude-haiku-5-5:
    input: 0.1
    output: 0.5
  claude-sonnet-5-5:
    input: 2.0
    output: 10.0
  claude-opus-5-5:
    input: 4.0
    output: 20.0
  gpt-4o-2024-08-06:
    input: 2.5
    output: 10.0
  gpt-5.6-luna:
    input: 0.2
    output: 1.2
  gpt-5.6-terra:
    input: 2.0
    output: 12.0
models:
  gpt-4o-2024-08-06:
    reasoning: false
  gpt-5.6-luna:
    reasoning: true
    reasoning_effort: medium
  gpt-5.6-terra:
    reasoning: true
    reasoning_effort: medium
reasoning_allowance:
  extract_claims: 1500
  analyze_stance: 800
  verify_claims: 2500
