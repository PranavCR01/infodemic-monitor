# Model routing table (design doc section 13).
#
# Every LLM step reads its provider, model and prompt version from this file;
# node code never names a model. Changing a model is a config change, and any
# change here must be evaluated against the baseline before it ships (section 14).
#
# STATUS: provisional. These are the design's *starting choices by task type*,
# not measured winners. The routing decision (app.evaluation.selection) waits
# for API keys and the per-step labelled test sets. Pinned ids only: never
# "latest" or a floating alias.
version: routing_v1
status: provisional

routing:
  extract_claims:    {provider: anthropic, model: claude-haiku-5-5,  prompt: extract_v2}   # small, fast, structured output
  analyze_stance:    {provider: anthropic, model: claude-sonnet-5-5, prompt: stance_v1}    # small or medium
  # plan_search is rules first (section 6); a model is only added if the rules
  # prove insufficient, so it is deliberately absent from this table.
  verify_claims:     {provider: anthropic, model: claude-opus-5-5,   prompt: verify_v3}    # strong reasoning
  critique:          {provider: openai,    model: gpt-4o-2024-08-06, prompt: critic_v1}    # different provider from the verifier
  judge_explanation: {provider: anthropic, model: claude-sonnet-5-5, prompt: explain_v2}   # writing quality; label already decided
  fallback:
    on: [timeout, 5xx]
    retries: 1          # retries on the primary before falling back
    use: {provider: openai, model: gpt-4o-2024-08-06}

# Per-model request settings (T39). Only models listed here change their request;
# every other model is called exactly as before. `reasoning: true` (GPT-5-class models):
# the OpenAI client sends `max_completion_tokens` instead of `max_tokens` (these models
# reject max_tokens), sends no `temperature`, and the step's cap is raised by its
# reasoning_allowance below, because hidden reasoning tokens count against the cap and
# are billed as output. `token_param: max_completion_tokens` alone renames the cap
# without the other changes. Choose by model id here, never by name in code.
#
# `reasoning_effort` (none/low/medium/high/xhigh/max) is sent explicitly on every call
# to a reasoning model, so a run doesn't depend on the provider's default: a routing
# step or an experiment candidate may override it, else this value, else "medium".
# Every call also records the model id the response reports and its reasoning tokens.
models:
  gpt-4o-2024-08-06: {reasoning: false}
  # The lead's OpenAI routing-experiment candidates (PR #102). Aliases only: OpenAI
  # publishes no dated snapshot for them, so the experiment report records the model id
  # each response names. A live routing experiment refuses a candidate with
  # reasoning_tokens that is not marked reasoning here.
  gpt-5.6-luna:  {reasoning: true, reasoning_effort: medium}
  gpt-5.6-terra: {reasoning: true, reasoning_effort: medium}

# Extra output tokens per call, by step, added to a reasoning model's cap on top of the
# node's own (visible-answer) cap: extract_claims 2048 -> 3548, analyze_stance
# 512 -> 1312, verify_claims 1024 -> 3524. Values are T38's reasoning allowances; tune
# them from the first paid run's reported usage. A step without an entry may not route
# to a reasoning model (the config refuses to load).
reasoning_allowance:
  extract_claims: 1500
  analyze_stance: 800
  verify_claims: 2500

# USD per million tokens, used to report cost per video. Unpriced models report
# cost as unknown rather than zero. Check against the providers' price lists
# before a paid run.
pricing:
  claude-haiku-5-5:  {input: 0.10, output: 0.50}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-opus-5-5:   {input: 4.00, output: 20.00}
  gpt-4o-2024-08-06: {input: 2.50, output: 10.00}   # critic, fallback, and the single-call baseline
  # OpenAI candidates for the T38 routing experiment (prices from OpenAI's model pages,
  # read by the lead 2026-11-24; reasoning tokens are billed as output). OpenAI lists no
  # dated snapshot for these, only the alias, so the run records the model id each
  # response reports.
  gpt-5.6-luna:      {input: 0.20, output: 1.20}    # "nano" tier
  gpt-5.6-terra:     {input: 2.00, output: 12.00}   # "mini" tier
